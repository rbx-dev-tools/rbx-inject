name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Three targets, not the four rbx-cli ships. The missing one is
  # x86_64-unknown-linux-musl, and it is missing on purpose rather than by
  # oversight: rbx-cli builds musl through cargo-zigbuild, and this crate
  # compiles Luau from vendored C++, so a musl build has to link libstdc++
  # statically through zig cc as well. That may well work; it has not been
  # verified, and shipping an artifact that fails to start is worse than not
  # shipping it. Add it once a build has been proven to run on a musl image.
  #
  # The consequence to know about: the linux-gnu binary is compiled against the
  # runner's glibc and will not start on an older distribution. Build from
  # source there until musl lands.
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rbx-inject
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rbx-inject.exe
          # Apple silicon only. These runners bill at 10x, and an x86_64 macOS
          # build would double that for machines Apple stopped selling.
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rbx-inject
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      # --locked: a release must build the dependency versions that were
      # tested, not whatever resolved on the day the tag was pushed.
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin rbx-inject

      # The binary embeds Luau and a reflection database, so "it linked" is not
      # the same as "it runs". One real invocation proves both before publish.
      - name: The binary must run
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../rbx-inject-${{ github.ref_name }}-${{ matrix.target }}.zip rbx-inject
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path rbx-inject.exe -DestinationPath ../../../rbx-inject-${{ github.ref_name }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bins-${{ matrix.target }}
          path: rbx-inject-*.zip

  release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bins-*
          merge-multiple: true

      # One file listing every archive, so a download can be verified without
      # trusting the release page it came from.
      - name: Generate SHA256 checksums
        run: sha256sum rbx-inject-*.zip > SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            rbx-inject-*.zip
            SHA256SUMS
